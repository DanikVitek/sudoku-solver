<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body {
            margin: 0;
        }

        .wrapper {
            height: 100vh;
            width: 100vw;
            background-color: #333;
        }

        .aspect-box {
            aspect-ratio: 16 / 9;
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            background-color: lightblue;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="aspect-box"></div>
</div>
</body>
</html>
